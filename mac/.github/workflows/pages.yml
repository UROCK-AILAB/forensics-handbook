name: 페이지 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 쪽마다 마지막 수정 날짜를 git 기록에서 읽으려면 전체 기록이 필요하다
      - name: 쪽마다 마지막 수정 날짜 넣기(git 기록, 저장소 파일은 그대로 둠)
        run: |
          git ls-files '*.md' | while IFS= read -r f; do
            d=$(git log -1 --format=%cs -- "$f")
            if [ -n "$d" ] && [ "$(head -1 "$f")" = "---" ]; then sed -i "1a last_modified_date: $d\nlast_modified_at: $d" "$f"; fi
          done
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
