{% if page.last_modified_date %}<p class="last-modified">마지막 수정: {{ page.last_modified_date }}</p>{% endif %}
<script>
  (function () {
    var list = document.querySelector('#site-nav > .nav-list');
    var nav = document.getElementById('site-nav');
    if (!nav || !list) return;
    /* 맨 위 단계(그룹)는 이동 없이 펼치고 접기만 한다. 그 밖의 메뉴는 열린 것을 누르면 접고, 닫힌 것은 이동하며 펼쳐진다. */
    nav.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a.nav-list-link') : null;
      if (!a) return;
      var li = a.parentElement;
      var ex = li.querySelector(':scope > .nav-list-expander');
      if (!ex) return;
      /* 현재 쪽의 메뉴는 테마가 링크 주소를 지우므로 닫힌 것도 여기서 펼친다. */
      if (li.parentElement === list || li.classList.contains('active') || !a.getAttribute('href')) {
        e.preventDefault();
        ex.click();
      }
    });
    /* 잘린 목차 제목은 마우스를 올리면 전체가 보인다. */
    nav.querySelectorAll('.nav-list-link').forEach(function (a) {
      if (!a.title) a.title = a.textContent.trim();
    });
  })();
</script>
<script>
  (function () {
    /* 왼쪽 메뉴가 없는 첫 화면에서는 테마가 검색 버튼을 연결하지 않으므로 여기서 연결한다. */
    if (document.getElementById('site-nav')) return;
    var btn = document.getElementById('search-button');
    var input = document.getElementById('search-input');
    var header = document.getElementById('main-header');
    if (!btn || !input) return;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      if (header) header.classList.add('nav-open');
      window.scrollTo(0, 0);
      input.focus();
    });
  })();
</script>
