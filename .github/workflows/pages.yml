name: 페이지 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 쪽마다 마지막 수정 날짜를 git 기록에서 읽으려면 전체 기록이 필요하다
      - name: 쪽마다 마지막 수정 날짜 넣기(git 기록, 저장소 파일은 그대로 둠)
        run: |
          git ls-files '*.md' | while IFS= read -r f; do
            d=$(git log -1 --format=%cs -- "$f")
            if [ -n "$d" ] && [ "$(head -1 "$f")" = "---" ]; then sed -i "1a last_modified_date: $d\nlast_modified_at: $d" "$f"; fi
          done
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: 첫 화면과 일곱 권을 각자 빌드
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --source home --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
          for k in windows mac linux android ios cloud network crypto ai; do
            if [ -d "$k" ]; then bundle exec jekyll build --source "$k" --destination "_site/$k" --baseurl "${{ steps.pages.outputs.base_path }}/$k"; fi
          done
          python3 tools/merge_search.py _site
          python3 tools/page_counts.py _site
          cp sitemap.xml landing-sitemap.xml _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
