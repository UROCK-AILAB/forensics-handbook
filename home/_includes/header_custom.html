<div class="hb-search">
  <input id="hb-search-input" type="search" placeholder="일곱 권 전체에서 찾기" autocomplete="off" aria-label="핸드북 전체 검색">
  <div id="hb-search-results" class="hb-search-results" hidden></div>
</div>
<style>
  .hb-search { position: relative; flex: 1; max-width: 42rem; align-self: center; padding: 0 1rem; }
  .hb-search input { width: 100%; padding: 0.55rem 0.8rem; font-size: 1rem; border: 1px solid #d7dae1; border-radius: 6px; background: #fff; }
  .hb-search input:focus { outline: none; border-color: #5c5962; box-shadow: 0 0 0 2px rgba(92, 89, 98, 0.15); }
  .hb-search-results { position: absolute; left: 1rem; right: 1rem; top: calc(100% + 4px); max-height: 70vh; overflow-y: auto; background: #fff; border: 1px solid #e3e5ea; border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12); z-index: 1000; }
  .hb-search-results a { display: block; padding: 0.6rem 0.9rem; border-bottom: 1px solid #f0f1f4; color: inherit; text-decoration: none; }
  .hb-search-results a:hover, .hb-search-results a.hb-on { background: #f5f6fa; }
  .hb-search-results .hb-doc { font-weight: 600; color: #264caf; }
  .hb-search-results .hb-sec { color: #5c6270; }
  .hb-search-results .hb-snip { display: block; margin-top: 0.2rem; font-size: 0.85rem; color: #5c6270; }
  .hb-search-results mark { background: #fff1a8; padding: 0; }
  .hb-search-results .hb-note { padding: 0.7rem 0.9rem; color: #5c6270; font-size: 0.9rem; }
</style>
<script>
  (function () {
    var input = document.getElementById('hb-search-input');
    var box = document.getElementById('hb-search-results');
    if (!input || !box) return;
    var DATA = '{{ "assets/js/search-data.json" | relative_url }}';
    var WORKER = '{{ "assets/js/search-worker.js" | relative_url }}';
    var worker = null, ready = false, seq = 0, timer = null, active = -1;

    function note(t) { box.hidden = false; box.innerHTML = '<div class="hb-note">' + t + '</div>'; }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function mark(s, terms) {
      var out = esc(s);
      terms.forEach(function (t) {
        var e = esc(t).replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
        if (e) out = out.replace(new RegExp(e, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
      });
      return out;
    }
    function start() {
      if (worker) return;
      worker = new Worker(WORKER);
      worker.onmessage = function (e) {
        var m = e.data;
        if (m.type === 'ready') { ready = true; if (input.value.trim()) ask(); else note('검색 목록을 불러왔습니다. ' + m.count.toLocaleString() + '개 항목에서 찾습니다.'); }
        else if (m.type === 'error') { note('검색 목록을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주십시오.'); }
        else if (m.type === 'results' && m.id === seq) { show(m); }
      };
      worker.postMessage({ type: 'load', url: DATA });
      note('검색 목록을 불러오는 중입니다…');
    }
    function ask() {
      var q = input.value.trim();
      if (!q) { box.hidden = true; return; }
      if (!ready) { note('검색 목록을 불러오는 중입니다…'); return; }
      seq += 1;
      worker.postMessage({ type: 'query', q: q, id: seq, url: DATA });
    }
    function show(m) {
      active = -1;
      if (!m.results.length) { note('찾은 결과가 없습니다.'); return; }
      var terms = m.q.split(/\s+/).filter(Boolean);
      var html = m.results.map(function (r) {
        var sec = r.title && r.title !== r.doc ? ' <span class="hb-sec">› ' + mark(r.title, terms) + '</span>' : '';
        var snip = r.snip ? '<span class="hb-snip">' + (r.cut ? '… ' : '') + mark(r.snip, terms) + ' …</span>' : '';
        return '<a href="' + esc(r.url) + '"><span class="hb-doc">' + mark(r.doc, terms) + '</span>' + sec + snip + '</a>';
      }).join('');
      var more = m.total > m.results.length ? '<div class="hb-note">' + m.total.toLocaleString() + '건 가운데 앞의 ' + m.results.length + '건을 보여 줍니다. 검색어를 더 넣으면 좁힐 수 있습니다.</div>' : '';
      box.hidden = false;
      box.innerHTML = html + more;
    }
    function move(d) {
      var links = box.querySelectorAll('a');
      if (!links.length) return;
      if (active >= 0) links[active].classList.remove('hb-on');
      active = (active + d + links.length) % links.length;
      links[active].classList.add('hb-on');
      links[active].scrollIntoView({ block: 'nearest' });
    }
    input.addEventListener('focus', start);
    input.addEventListener('input', function () { start(); clearTimeout(timer); timer = setTimeout(ask, 150); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      else if (e.key === 'Enter') {
        var links = box.querySelectorAll('a');
        if (links.length) { e.preventDefault(); window.location.href = links[active >= 0 ? active : 0].href; }
      }
      else if (e.key === 'Escape') { box.hidden = true; input.blur(); }
    });
    document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('.hb-search')) box.hidden = true; });
  })();
</script>
