title: iOS 디지털 포렌식 핸드북
description: iPhone에 남는 흔적을 읽고 해석하는 한국어 포렌식 핸드북
lang: ko
theme: just-the-docs
search_enabled: true
search:
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: 맨 위로
color_scheme: light
exclude:
  - _work
  - _manifest.json
plugins:
  - jekyll-relative-links
  - jekyll-last-modified-at
relative_links:
  enabled: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
