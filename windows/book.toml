[book]
title = "Windows 디지털 포렌식 위키"
description = "Windows 시스템에 남는 흔적을 읽고 해석하는 한국어 포렌식 위키"
language = "ko"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
sidebar-header-nav = false
additional-css = ["custom.css"]
additional-js = ["custom.js"]

[output.html.print]
enable = false

[output.html.fold]
enable = true
level = 0

[output.html.search]
limit-results = 20
